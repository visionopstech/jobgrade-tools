<style>

:root{--ink:#ffffff;--mute:#a9bccd;--teal:#3fc1cb;--orange:#f77f00;--red:#ff6b5e;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.14);--ln:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font:16px/1.6 Est,Tahoma,"Segoe UI",sans-serif;background:#0b1424;background-image:radial-gradient(circle at 30% 0%,#1f6f7a 0%,#14233b 50%,#0b1424 100%);background-attachment:fixed;min-height:100vh}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:14px 20px 0}
.head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}

.prog i.on{background:var(--teal)}

.screen.on{display:flex}

.step{margin:24px 0 0;font-size:13px;color:#8fd3da}

.fields{display:grid;gap:14px;margin:24px 0 0}

.newbig{display:block;width:100%;margin:18px 0 0;font:inherit;font-weight:700;font-size:15px;color:#fff;background:transparent;border:1.5px dashed var(--ln);border-radius:16px;padding:14px;cursor:pointer}

</style>

var STG=['جمله‌ها','اشتباه رایج','تمرین','پیام کامل'];
var st={v:'home',t:0,s:0,q:0,qs:[],picked:null,score:0,P:{}};
try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.P)st.P=d.P}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({P:st.P}))}catch(e){}}
function pr(id){return st.P[id]||(st.P[id]={s:0,best:0,stars:0})}
function fa(n){return Number(n).toLocaleString('fa-IR')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ph(s){return esc(s).replace(/\[([^\]]+)\]/g,'<i class="ph">[$1]</i>')}
function total(){var n=0;T.forEach(function(t){var p=st.P[t.id];if(p)n+=(p.best||0)*10+(p.s>=4?20:0)});return n}
function starsHtml(n){var h='';for(var i=0;i<3;i++)h+=i<n?'<i>★</i>':'★';return h}

// speech: device voice, free and offline where available
var canSay='speechSynthesis' in window;
function say(text,slow){
  if(!canSay)return false;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text.replace(/\[|\]/g,'').replace(/#/g,' number '));u.lang='en-US';u.rate=slow?0.6:0.95;
  var v=speechSynthesis.getVoices().filter(function(x){return /^en(-|_)US/i.test(x.lang)})[0];if(v)u.voice=v;speechSynthesis.speak(u);return true}catch(e){return false}
}

function home(){
  return '<div class="head"><span>جعبه ابزار جابگرید</span><b>انگلیسی کاری</b></div>'+
   '<div class="hero"><h1>انگلیسی برای موقعیت‌های واقعی کار</h1><div class="pts">⭐ '+fa(total())+'<small>امتیاز</small></div></div>'+
   '<p class="sub">یه موضوع انتخاب کن. هر موضوع ۴ مرحله داره: جمله‌ها با صدا، اشتباه‌های رایج، تمرین، و یه پیام کامل برای کپی.</p>'+
   '<div class="topics">'+T.map(function(t,i){var p=pr(t.id);return '<button type="button" class="topic'+(p.s>=4?' done':'')+'" data-t="'+i+'"><span class="em">'+t.e+'</span><b>'+t.t+'</b><small>'+t.s+'</small><span class="bar4">'+[0,1,2,3].map(function(k){return '<i class="'+(k<p.s?'on':'')+'"></i>'}).join('')+'</span><span class="st">'+starsHtml(p.stars)+'</span></button>'}).join('')+'</div>'+
   (canSay?'':'<p class="hint">صدای انگلیسی روی این گوشی در دسترس نیست؛ بقیه‌ی بخش‌ها کار می‌کنن.</p>');
}
function topicHead(){
  var t=T[st.t],p=pr(t.id);
  return '<button type="button" class="backl" id="toHome">→ همه‌ی موضوع‌ها</button><div class="tt">'+t.e+' '+t.t+'</div>'+
   '<div class="stg">'+STG.map(function(n,i){return '<button type="button" data-s="'+i+'" class="'+(i===st.s?'on':'')+(i<p.s?' ok':'')+'">'+fa(i+1)+'. '+n+(i<p.s?' ✓':'')+'</button>'}).join('')+'</div>';
}
function stage(){
  var t=T[st.t];
  if(st.s===0)return '<p class="sub">هر جمله رو بخون و گوش بده. قسمت‌های <i class="ph">[نارنجی]</i> رو با اطلاعات خودت عوض کن.</p>'+
    t.p.map(function(x,i){return '<div class="phr"><div class="en">'+ph(x[0])+'</div><div class="fa">'+ph(x[1])+'</div>'+(canSay?'<div class="say"><button type="button" data-say="'+i+'">🔊 گوش بده</button><button type="button" data-slow="'+i+'">🐢 آروم</button></div>':'')+'</div>'}).join('');
  if(st.s===1)return '<p class="sub">اول جمله‌ی غلط رو بخون و حدس بزن چرا غلطه، بعد درستش رو ببین.</p>'+
    t.m.map(function(x,i){return '<div class="mis"><div class="bad">'+esc(x[0])+'</div><div id="mr'+i+'" hidden><div class="good">'+esc(x[1])+'</div><div class="why">'+esc(x[2])+'</div></div><button type="button" class="reveal" data-rv="'+i+'">ببین درستش چیه 👀</button></div>'}).join('');
  if(st.s===2)return quiz();
  return '<p class="sub">این یه پیام کامل با همه‌ی چیزهاییه که یاد گرفتی. کپیش کن و قسمت‌های داخل [ ] رو عوض کن.</p><div class="msg">'+ph(t.x)+'</div>'+
    '<div class="acts"><button type="button" class="main" id="cpMsg">📋 کپی پیام</button>'+(canSay?'<button type="button" id="sayMsg">🔊 گوش بده</button>':'')+'</div><p class="copied" id="copied" hidden></p>';
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function startQuiz(){var t=T[st.t];st.q=0;st.score=0;st.picked=null;st.qs=t.q.map(function(q){var o=q[1].map(function(s,i){return {s:s,ok:i===q[2]}});return {q:q[0],o:shuffle(o)}})}
function isEn(s){return /^[A-Za-z0-9'"(\[]/.test(s)}
function quiz(){
  if(!st.qs.length)startQuiz();
  if(st.q>=st.qs.length){
    var n=st.score,stars=n>=5?3:n>=4?2:n>=3?1:0;
    return '<div class="stars">'+starsHtml(stars)+'</div><div class="big1">'+fa(n)+' از '+fa(st.qs.length)+' درست!</div>'+
     '<p class="sub" style="text-align:center">'+(stars===3?'عالی! همه رو درست زدی 🎉':stars>=1?'خوبه! یه بار دیگه بزنی، ستاره‌ی کامل می‌گیری.':'اشکالی نداره. جمله‌ها رو یه بار دیگه ببین و دوباره امتحان کن.')+'</p>'+
     '<button type="button" class="aibtn ghost" id="retry">🔁 دوباره تمرین کن</button>';
  }
  var q=st.qs[st.q],answered=st.picked!==null;
  return '<div class="qbox"><div class="qn">سؤال '+fa(st.q+1)+' از '+fa(st.qs.length)+' · امتیاز: '+fa(st.score*10)+'</div><div class="qq'+(isEn(q.q)?' ltr':'')+'">'+esc(q.q)+'</div><div class="opts">'+
   q.o.map(function(o,i){var c=answered?(o.ok?'right':(i===st.picked?'wrong':'')):'';return '<button type="button" data-o="'+i+'" class="'+(isEn(o.s)?'ltr ':'')+c+'"'+(answered?' disabled':'')+'>'+esc(o.s)+'</button>'}).join('')+
   '</div><div class="fb">'+(answered?(q.o[st.picked].ok?'✅ آفرین! +۱۰':'❌ جواب درست سبز شده.'):'')+'</div></div>';
}
function draw(){
  var a=$('app');
  if(st.v==='home'){a.innerHTML=home();$('back').hidden=true;$('next').hidden=true}
  else{
    a.innerHTML=topicHead()+stage();$('back').hidden=false;$('next').hidden=false;
    $('back').textContent=st.s===0?'موضوع‌ها':'قبلی';
    var t=T[st.t];
    if(st.s===2&&st.q<st.qs.length){$('next').textContent=st.picked===null?'یه گزینه رو انتخاب کن':'سؤال بعد ←';$('next').disabled=st.picked===null}
    else{$('next').disabled=false;$('next').textContent=st.s===3?'✅ تموم شد!':'مرحله‌ی بعد ←'}
  }
  window.scrollTo(0,0);save();
}
function mark(s){var p=pr(T[st.t].id);if(p.s<s)p.s=s}
function open(i){st.v='topic';st.t=i;var p=pr(T[i].id);st.s=Math.min(p.s,3);st.qs=[];draw()}
$('app').addEventListener('click',function(e){
  var b;
  if(b=e.target.closest('[data-t]'))return open(+b.dataset.t);
  if(e.target.closest('#toHome')){st.v='home';return draw()}
  if(b=e.target.closest('.stg [data-s]')){st.s=+b.dataset.s;if(st.s===2)st.qs=[];return draw()}
  if(b=e.target.closest('[data-say]')){say(T[st.t].p[+b.dataset.say][0]);return}
  if(b=e.target.closest('[data-slow]')){say(T[st.t].p[+b.dataset.slow][0],true);return}
  if(b=e.target.closest('[data-rv]')){$('mr'+b.dataset.rv).hidden=false;b.hidden=true;return}
  if(b=e.target.closest('[data-o]')){if(st.picked!==null)return;st.picked=+b.dataset.o;if(st.qs[st.q].o[st.picked].ok)st.score++;return draw()}
  if(e.target.closest('#retry')){startQuiz();return draw()}
  if(e.target.closest('#sayMsg')){say(T[st.t].x);return}
  if(e.target.closest('#cpMsg')){
    var txt=T[st.t].x,c=$('copied');function done(ok){c.textContent=ok?'کپی شد ✓':'کپی نشد؛ متن رو با لمس طولانی انتخاب کن.';c.hidden=false;setTimeout(function(){c.hidden=true},2500)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)});else done(false);
  }
});
$('next').onclick=function(){
  if(st.v!=='topic')return;
  if(st.s===2&&st.q<st.qs.length){if(st.picked===null)return;st.q++;st.picked=null;
    if(st.q>=st.qs.length){var p=pr(T[st.t].id),n=st.score,stars=n>=5?3:n>=4?2:n>=3?1:0;p.best=Math.max(p.best||0,n);p.stars=Math.max(p.stars||0,stars);mark(3)}
    return draw()}
  if(st.s===3){mark(4);st.v='home';return draw()}
  mark(st.s+1);st.s++;if(st.s===2)st.qs=[];draw();
};
$('back').onclick=function(){if(st.v!=='topic')return;if(st.s===0){st.v='home'}else{st.s--;if(st.s===2)st.qs=[]}draw()};
if(canSay)try{speechSynthesis.getVoices()}catch(e){}
draw();
})();
</script>

<!-- Jobgrade sync: keeps each user's progress on Jobgrade's server (by Telegram account), so it survives other devices -->
<style>
.jg-note{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#eef3fa;color:#3b4b63;font:13px/1.6 Est,Vazirmatn,Tahoma,sans-serif;padding:6px max(4vw,12px);direction:rtl;border-bottom:1px solid #d8e2ef}
.jg-note button{font:inherit;font-size:15px;background:none;border:0;color:inherit;cursor:pointer;padding:2px 8px;min-height:30px}
@media(prefers-color-scheme:dark){html:not([data-theme=light]) .jg-note{background:#182740;color:#b9c6d8;border-color:#26385a}}
html[data-theme=dark] .jg-note{background:#182740;color:#b9c6d8;border-color:#26385a}
</style>
<script>
(function(){
  var SLUG='english', API='https://jobgrade-ai.ali-jaccobi.workers.dev/sync';
  function J(k){try{return JSON.parse(localStorage.getItem(k)||'null')||{}}catch(e){return {}}}
  // which saved keys belong to each tool, and how far the user got (for the dashboard)
  var CFG={
    pricing:{keys:['jg-tool-001-v3','jg-rate-v1'],stage:function(){var d=J('jg-tool-001-v3'),r=J('jg-rate-v1'),s=d.step||1;
      return {step:s,total:7,done:s>=7,info:{'خدمت':d.service||'','نوع':d.kind||'','نرخ ساعتی (هزار تومان)':r.rateK||''}}}},
    email:{keys:['jg-tool-019-v1'],stage:function(){var d=J('jg-tool-019-v1'),s=d.step||1;
      return {step:s,total:5,done:s>=5&&!!(d.vers&&d.vers.length),info:{'هدف':d.goal||'','رابطه':d.rel||''}}}},
    aiguide:{keys:['jg-tool-020-v1'],stage:function(){var d=J('jg-tool-020-v1'),n=(d.done||[]).length;
      return {step:n,total:9,done:n>=9,info:null}}},
    english:{keys:['jg-tool-022-v1'],stage:function(){var P=J('jg-tool-022-v1').P||{},n=0,st=0;
      Object.keys(P).forEach(function(k){if(P[k].s>=4)n++;st+=P[k].stars||0});
      return {step:n,total:6,done:n>=6,info:{'ستاره':st}}}}
  };
  var c=CFG[SLUG], tg=window.Telegram&&Telegram.WebApp, init=tg&&tg.initData;
  if(!c||!init)return; // outside Telegram: progress stays on this device only
  var TS='jg-sync-'+SLUG, DIRTY='jg-dirty-'+SLUG, set=localStorage.setItem.bind(localStorage);
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}

  // one short line so users know their progress is kept
  if(!get('jg-note-ok')){
    var n=document.createElement('div');n.className='jg-note';
    n.innerHTML='<span>🔒 برای ذخیره‌ی پیشرفتت، اطلاعات استفاده‌ات پیش جاب‌گرید نگه داشته می‌شه.</span><button type="button" aria-label="بستن">✕</button>';
    n.querySelector('button').onclick=function(){n.remove();try{set('jg-note-ok','1')}catch(e){}};
    var bar=document.querySelector('.jg-bar');
    if(bar&&bar.parentNode)bar.parentNode.insertBefore(n,bar.nextSibling);else document.body.insertBefore(n,document.body.firstChild);
  }

  function post(o,keep){
    o.initData=init;o.tool=SLUG;var s=c.stage();o.step=s.step;o.total=s.total;o.done=s.done;o.info=s.info;
    return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o),keepalive:!!keep}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
  }
  var timer=null, busy=false;
  function push(keep){
    clearTimeout(timer);timer=null;
    if(!get(DIRTY))return;
    var st={};c.keys.forEach(function(k){var v=get(k);if(v!=null)st[k]=v});
    try{localStorage.removeItem(DIRTY)}catch(e){}
    post({op:'save',state:st},keep).then(function(r){if(r&&r.ts){try{set(TS,String(r.ts))}catch(e){}}else{try{set(DIRTY,'1')}catch(e){}}});
  }
  // every save of this tool's keys is sent to the server a moment later
  localStorage.setItem=function(k,v){
    var old=get(k);set(k,v);
    if(c.keys.indexOf(k)>=0&&old!==String(v)){try{set(DIRTY,'1')}catch(e){}clearTimeout(timer);timer=setTimeout(push,2000)}
  };
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&timer)push(true)});
  window.addEventListener('pagehide',function(){if(timer)push(true)});

  post({op:'open'}).then(function(r){
    if(!r)return;
    var mine=+(get(TS)||0);
    if(get(DIRTY)){push();return}              // unsent changes on this device win
    if(r.state&&r.ts>mine){                     // newer progress from another device
      var changed=false;
      Object.keys(r.state).forEach(function(k){if(c.keys.indexOf(k)>=0&&get(k)!==r.state[k]){set(k,r.state[k]);changed=true}});
      set(TS,String(r.ts));
      var g='jg-reloaded-'+SLUG;
      if(changed&&!sessionStorage.getItem(g)){try{sessionStorage.setItem(g,'1')}catch(e){}location.reload()}
      return;
    }
    if(!r.state){var any=c.keys.some(function(k){return get(k)!=null});if(any){try{set(DIRTY,'1')}catch(e){}push()}}
  });
})();
</script>
